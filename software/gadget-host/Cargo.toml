[package]
name = "gadget-host"
version = "0.1.0"
edition = "2021"

[dependencies]
gadget-common = { path = "../gadget-common" }
serialport = "4.7"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

