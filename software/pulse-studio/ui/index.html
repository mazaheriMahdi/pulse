<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSE STUDIO — Hardware Control & Diagnostics</title>
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/screen.css">
  <link rel="stylesheet" href="css/faces.css">
</head>
<body>
  <div class="app">
    <!-- Custom Window Titlebar -->
    <header class="titlebar">
      <div class="title-left">
        <span class="brand-glyph"></span>
        <span class="brand-text">PULSE</span>
        <span class="brand-sub">STUDIO // V1.2.0</span>
      </div>

      <div class="title-center">
        <div class="status-pill" id="conn-pill">
          <span class="indicator-dot"></span>
          <span id="conn-status-text">CONNECTING...</span>
        </div>
      </div>

      <div class="title-right">
        <button class="win-btn" id="win-min" title="Minimize" aria-label="Minimize">
          <svg width="10" height="2" viewBox="0 0 10 2"><rect width="10" height="2" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="win-max" title="Maximize" aria-label="Maximize">
          <svg width="9" height="9" viewBox="0 0 9 9"><rect x="0.5" y="0.5" width="8" height="8" stroke="currentColor" fill="none"/></svg>
        </button>
        <button class="win-btn close" id="win-close" title="Close" aria-label="Close">
          <svg width="9" height="9" viewBox="0 0 9 9"><path d="M1 1 L8 8 M8 1 L1 8" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </header>

    <!-- Main 3-Column Studio Workspace -->
    <main class="workspace">
      <!-- Left Column: Face Library -->
      <aside class="library-pane">
        <div class="pane-header">
          <span class="title">FACE LIBRARY</span>
          <span class="count">06 FACES</span>
        </div>
        <div class="pane-scroll">
          <div class="faces-grid" id="faces-grid">
            <!-- Populated dynamically by app.js -->
          </div>
        </div>
      </aside>

      <!-- Center Column: Responsive Live Hardware Preview -->
      <section class="stage-pane">
        <div class="preview-area" id="preview-area">
          <div class="scaler-wrapper">
            <div class="screen-chassis" id="screen">
              <!-- Rendered pixel-for-pixel by faces.js & font.js -->
            </div>
          </div>
        </div>
        <div class="stage-footer">
          <span>PORT: /dev/ttyUSB1</span>
          <span class="status-msg" id="flash-status">READY</span>
          <span>480 × 320 TFT · 60Hz</span>
        </div>
      </section>

      <!-- Right Column: Settings & Hardware Flash -->
      <aside class="settings-pane">
        <div class="pane-header">
          <span class="title">CONFIGURATION</span>
        </div>

        <div class="settings-scroll">
          <!-- Accent Color Swatches -->
          <div class="control-group">
            <div class="group-title">ACCENT PALETTE</div>
            <div class="swatches-row">
              <button class="swatch-btn active" data-color="#ffffff" title="White" aria-label="White"></button>
              <button class="swatch-btn" data-color="#d71921" title="Nothing Red" aria-label="Red"></button>
              <button class="swatch-btn" data-color="#ff5a00" title="Orange" aria-label="Orange"></button>
              <button class="swatch-btn" data-color="#2ee6c5" title="Cyan" aria-label="Cyan"></button>
              <button class="swatch-btn" data-color="#8b8cf9" title="Purple" aria-label="Purple"></button>
              <button class="swatch-btn" data-color="#ffc247" title="Gold" aria-label="Gold"></button>
            </div>
          </div>

          <!-- Refresh Rate -->
          <div class="control-group">
            <div class="group-title">REFRESH FREQUENCY</div>
            <div class="segmented-control">
              <button data-refresh="1">1 HZ</button>
              <button class="active" data-refresh="5">5 HZ</button>
              <button data-refresh="10">10 HZ</button>
              <button data-refresh="20">20 HZ</button>
            </div>
          </div>

          <!-- Display Brightness Slider -->
          <div class="control-group">
            <div class="group-title">
              <span>BRIGHTNESS</span>
              <span class="val-hint" id="brightness-val">80%</span>
            </div>
            <div class="slider-container">
              <input type="range" class="range-slider" id="brightness-slider" min="10" max="100" value="80">
            </div>
          </div>

          <!-- Feature Flags & Overlays -->
          <div class="control-group">
            <div class="group-title">HARDWARE OVERLAYS</div>
            <div class="toggle-list">
              <label class="toggle-item">
                <span>Display Metric Labels</span>
                <input type="checkbox" id="opt-label" checked>
                <span class="switch"></span>
              </label>

              <label class="toggle-item">
                <span>Show Thermal Telemetry</span>
                <input type="checkbox" id="opt-temp" checked>
                <span class="switch"></span>
              </label>

              <label class="toggle-item">
                <span>Display Metric Units</span>
                <input type="checkbox" id="opt-units" checked>
                <span class="switch"></span>
              </label>

              <label class="toggle-item">
                <span>Invert Palette (White Background)</span>
                <input type="checkbox" id="opt-invert">
                <span class="switch"></span>
              </label>

              <label class="toggle-item">
                <span>Auto Brightness Sync</span>
                <input type="checkbox" id="opt-auto" checked>
                <span class="switch"></span>
              </label>
            </div>
          </div>

          <!-- Profile Presets -->
          <div class="control-group">
            <div class="group-title">PROFILE PRESETS</div>
            <div class="preset-btn-row">
              <button class="preset-btn" id="preset-save">SAVE PRESET</button>
              <button class="preset-btn" id="preset-load">LOAD PRESET</button>
            </div>
          </div>
        </div>

        <!-- Hardware Flash Commit Action -->
        <div class="settings-footer">
          <button class="flash-btn" id="flash-btn">
            <span class="flash-icon">⚡</span>
            <span class="flash-text">FLASH TO GADGET</span>
          </button>
        </div>
      </aside>
    </main>
  </div>

  <!-- Application Controller Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
